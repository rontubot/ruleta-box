<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Velada del Caos - Pantalla TV / Cronómetro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Chakra+Petch:wght@700;800;900&family=Inter:wght@600;700;800&display=swap">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #06070b;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4vh 5vw;
      user-select: none;
      position: relative;
    }

    /* Ambient glow effects */
    body::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(255, 30, 86, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: 10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(0, 210, 211, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* HEADER */
    .tv-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .event-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: clamp(20px, 3.5vw, 42px);
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffd32a;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(255, 211, 42, 0.4);
    }

    .phase-badge {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(14px, 2vw, 24px);
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .phase-badge.fighting {
      background: #2ed573;
      color: #06070b;
      box-shadow: 0 0 30px rgba(46, 213, 115, 0.5);
    }

    .phase-badge.paused {
      background: #ff4757;
      color: #fff;
      box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
    }

    .phase-badge.rest {
      background: #ffa502;
      color: #06070b;
      box-shadow: 0 0 30px rgba(255, 165, 2, 0.5);
    }

    .phase-badge.protection {
      background: #ff1e56;
      color: #fff;
      box-shadow: 0 0 35px rgba(255, 30, 86, 0.8);
      animation: flash 0.5s infinite alternate;
    }

    /* CENTER STAGE: GIANT TIMER & ROUND */
    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      width: 100%;
    }

    .round-tag {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(28px, 5.5vw, 68px);
      font-weight: 900;
      letter-spacing: 6px;
      color: #f1f2f6;
      text-transform: uppercase;
      margin-bottom: 2vh;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .giant-clock {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(80px, 24vw, 320px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 60px rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
      margin: 1vh 0 3vh;
    }

    .giant-clock.urgent {
      color: #ff4757;
      text-shadow: 0 0 80px rgba(255, 71, 87, 0.8);
      animation: urgentPulse 0.5s infinite alternate;
    }

    .giant-clock.rest-mode {
      color: #ffd32a;
      text-shadow: 0 0 80px rgba(255, 211, 42, 0.6);
    }

    /* PROGRESS BAR */
    .progress-track {
      width: 75vw;
      max-width: 1200px;
      height: clamp(10px, 1.8vh, 22px);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ffd32a, #ff1e56);
      transition: width 1s linear;
      box-shadow: 0 0 20px rgba(255, 211, 42, 0.6);
    }

    /* FOOTER CORNER DISPLAY */
    .tv-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      padding-top: 2vh;
    }

    .corner-tag {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: clamp(16px, 2.5vw, 32px);
      font-weight: 800;
      padding: 10px 24px;
      border-radius: 14px;
      max-width: 40vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .corner-tag.red {
      color: #fff;
      background: rgba(255, 30, 86, 0.2);
      border: 2px solid #ff1e56;
      box-shadow: 0 0 25px rgba(255, 30, 86, 0.3);
    }

    .corner-tag.blue {
      color: #fff;
      background: rgba(0, 210, 211, 0.2);
      border: 2px solid #00d2d3;
      box-shadow: 0 0 25px rgba(0, 210, 211, 0.3);
      text-align: right;
    }

    /* TV EVENT CARD (BELOW CLOCK - ALWAYS VISIBLE WHILE EVENT IS ACTIVE) */
    .tv-event-card {
      width: 75vw;
      max-width: 1200px;
      margin-top: clamp(10px, 1.8vh, 22px);
      background: linear-gradient(135deg, rgba(16, 20, 32, 0.95), rgba(9, 11, 18, 0.98));
      border: 2px solid #ffd32a;
      border-radius: 16px;
      padding: clamp(8px, 1.4vh, 16px) clamp(14px, 1.8vw, 24px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 211, 42, 0.25);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.4s ease;
    }

    .tv-event-card.team-red {
      border-color: #ff1e56;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 30, 86, 0.4);
    }

    .tv-event-card.team-blue {
      border-color: #00d2d3;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 210, 211, 0.4);
    }

    .tv-event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tv-event-badge {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(11px, 1.3vw, 16px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffd32a;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tv-event-countdown {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(13px, 1.6vw, 20px);
      font-weight: 900;
      color: #fff;
      background: rgba(255, 211, 42, 0.2);
      border: 1px solid rgba(255, 211, 42, 0.5);
      padding: 3px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    .tv-event-countdown.urgent {
      background: rgba(255, 71, 87, 0.3);
      border-color: #ff4757;
      color: #ff4757;
      animation: urgentPulse 0.5s infinite alternate;
    }

    .tv-event-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .tv-event-main {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .tv-event-icon {
      font-size: clamp(22px, 3.2vw, 40px);
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8));
    }

    .tv-event-texts {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .tv-event-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: clamp(16px, 2.4vw, 30px);
      font-weight: 900;
      color: #fff;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    .tv-event-desc {
      font-size: clamp(11px, 1.2vw, 15px);
      color: #ced6e0;
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tv-event-pts {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(12px, 1.6vw, 20px);
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 8px;
      background: #ffd32a;
      color: #0b0c10;
      white-space: nowrap;
      box-shadow: 0 0 15px rgba(255, 211, 42, 0.4);
    }

    /* TV EVENT PROGRESS BAR */
    .tv-event-progress-track {
      width: 100%;
      height: clamp(5px, 0.8vh, 10px);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    .tv-event-progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ffd32a, #ff4757);
      transition: width 1s linear;
      box-shadow: 0 0 10px rgba(255, 211, 42, 0.7);
    }

    /* NEXT SPIN PREVIEW (WHEN NO EVENT ACTIVE) */
    .tv-next-spin-pill {
      margin-top: clamp(8px, 1.4vh, 18px);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: clamp(5px, 0.8vh, 10px) clamp(14px, 1.8vw, 24px);
      border-radius: 30px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(13px, 1.4vw, 18px);
      color: #a4b0be;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .tv-next-spin-pill strong {
      color: #ffd32a;
    }

    /* ANIMATIONS */
    @keyframes urgentPulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- TV TOP BAR -->
  <header class="tv-header">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="event-title">🥊 LA VELADA DEL CAOS</div>
      <div id="tvConnBadge" style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 12px; background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.4); text-transform: uppercase; letter-spacing: 1px;">
        🟢 EN VIVO
      </div>
    </div>
    <div class="phase-badge" id="tvPhaseBadge">EN ESPERA</div>
  </header>

  <!-- TV CENTER CLOCK -->
  <main class="timer-container">
    <div class="round-tag" id="tvRoundTag">ROUND 1 / 3</div>
    <div class="giant-clock" id="tvClock">01:30</div>
    <div class="progress-track">
      <div class="progress-fill" id="tvProgressFill" style="width: 100%;"></div>
    </div>

    <!-- EVENT / RULE DISPLAY BELOW CLOCK -->
    <div class="tv-event-card" id="tvEventCard" style="display: none;">
      <div class="tv-event-header">
        <span class="tv-event-badge" id="tvEventBadge">⚡ EVENTO ACTIVO</span>
        <span class="tv-event-countdown" id="tvEventCountdown">⏱️ QUEDAN 30s</span>
      </div>
      <div class="tv-event-body">
        <div class="tv-event-main">
          <span class="tv-event-icon" id="tvEventIcon">🥊</span>
          <div class="tv-event-texts">
            <h2 class="tv-event-title" id="tvEventTitle">EL MANCO</h2>
            <p class="tv-event-desc" id="tvEventDesc">Una mano a la espalda o pegada al cuerpo.</p>
          </div>
        </div>
        <div class="tv-event-pts" id="tvEventPts">+10 PTS</div>
      </div>
      <div class="tv-event-progress-track">
        <div class="tv-event-progress-fill" id="tvEventProgressFill" style="width: 100%;"></div>
      </div>
    </div>

    <!-- NEXT EVENT PREVIEW (WHEN NO EVENT ACTIVE) -->
    <div class="tv-next-spin-pill" id="tvNextSpinPill" style="display: none;">
      <span>🎲 Próximo Evento de Ruleta en:</span>
      <strong id="tvNextSpinSec">30s</strong>
    </div>
  </main>

  <!-- TV FOOTER (FIGHTERS) -->
  <footer class="tv-footer">
    <div class="corner-tag red" id="tvRedName">🔴 Esquina Roja</div>
    <div class="corner-tag blue" id="tvBlueName">🔵 Esquina Azul</div>
  </footer>

  <script>
    const socket = io({
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      timeout: 20000
    });

    const tvConnBadge = document.getElementById('tvConnBadge');
    socket.on('connect', () => {
      if (tvConnBadge) {
        tvConnBadge.style.background = 'rgba(46, 213, 115, 0.2)';
        tvConnBadge.style.color = '#2ed573';
        tvConnBadge.style.borderColor = 'rgba(46, 213, 115, 0.4)';
        tvConnBadge.textContent = '🟢 EN VIVO';
      }
    });

    socket.on('disconnect', () => {
      if (tvConnBadge) {
        tvConnBadge.style.background = 'rgba(255, 71, 87, 0.3)';
        tvConnBadge.style.color = '#ff4757';
        tvConnBadge.style.borderColor = '#ff4757';
        tvConnBadge.textContent = '🔴 RECONECTANDO...';
      }
    });

    socket.on('connect_error', () => {
      if (tvConnBadge) {
        tvConnBadge.style.background = 'rgba(255, 71, 87, 0.3)';
        tvConnBadge.style.color = '#ff4757';
        tvConnBadge.style.borderColor = '#ff4757';
        tvConnBadge.textContent = '⚠️ SIN CONEXIÓN';
      }
    });

    const tvPhaseBadge = document.getElementById('tvPhaseBadge');
    const tvRoundTag = document.getElementById('tvRoundTag');
    const tvClock = document.getElementById('tvClock');
    const tvProgressFill = document.getElementById('tvProgressFill');
    const tvRedName = document.getElementById('tvRedName');
    const tvBlueName = document.getElementById('tvBlueName');

    // TV Event elements
    const tvEventCard = document.getElementById('tvEventCard');
    const tvEventBadge = document.getElementById('tvEventBadge');
    const tvEventCountdown = document.getElementById('tvEventCountdown');
    const tvEventIcon = document.getElementById('tvEventIcon');
    const tvEventTitle = document.getElementById('tvEventTitle');
    const tvEventDesc = document.getElementById('tvEventDesc');
    const tvEventPts = document.getElementById('tvEventPts');
    const tvEventProgressFill = document.getElementById('tvEventProgressFill');
    const tvNextSpinPill = document.getElementById('tvNextSpinPill');
    const tvNextSpinSec = document.getElementById('tvNextSpinSec');

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    socket.on('state_update', (state) => {
      // Fighters
      tvRedName.textContent = `🔴 ${state.redFighter || 'Esquina Roja'}`;
      tvBlueName.textContent = `${state.blueFighter || 'Esquina Azul'} 🔵`;

      // Reset classes
      tvClock.className = 'giant-clock';
      tvPhaseBadge.className = 'phase-badge';

      if (state.phase === 'fighting') {
        tvPhaseBadge.classList.add('fighting');
        tvPhaseBadge.textContent = 'COMBATE ACTIVO';
        tvRoundTag.textContent = `ROUND ${state.currentRound} / ${state.maxRounds}`;
        tvClock.textContent = formatTime(state.roundTimeLeft);
        
        const pct = (state.roundTimeLeft / state.roundDuration) * 100;
        tvProgressFill.style.width = `${pct}%`;
        
        if (state.roundTimeLeft <= 10 && state.roundTimeLeft > 0) {
          tvClock.classList.add('urgent');
        }
      } else if (state.phase === 'paused') {
        tvPhaseBadge.classList.add('paused');
        tvPhaseBadge.textContent = 'PAUSA (¡STOP!)';
        tvRoundTag.textContent = `ROUND ${state.currentRound} / ${state.maxRounds}`;
        tvClock.textContent = formatTime(state.roundTimeLeft);
      } else if (state.phase === 'rest') {
        tvPhaseBadge.classList.add('rest');
        tvPhaseBadge.textContent = 'MINUTO DE DESCANSO';
        tvRoundTag.textContent = `DESCANSO • R${state.currentRound}`;
        tvClock.classList.add('rest-mode');
        tvClock.textContent = formatTime(state.restTimeLeft);
        
        const pct = (state.restTimeLeft / state.restDuration) * 100;
        tvProgressFill.style.width = `${pct}%`;
        
        if (state.restTimeLeft <= 10) {
          tvClock.classList.add('urgent');
          tvPhaseBadge.textContent = '¡SEGUNDOS AFUERA!';
        }
      } else if (state.phase === 'protection') {
        tvPhaseBadge.classList.add('protection');
        tvPhaseBadge.textContent = 'CUENTA DE PROTECCIÓN';
        tvRoundTag.textContent = 'CUENTA REGLAMENTARIA (8-COUNT)';
        tvClock.classList.add('urgent');
        tvClock.textContent = `00:0${state.protectionCount}`;
        tvProgressFill.style.width = `${(state.protectionCount / 8) * 100}%`;
      } else if (state.phase === 'finished') {
        tvPhaseBadge.textContent = 'FINALIZADO';
        tvRoundTag.textContent = 'FIN DEL COMBATE';
        tvClock.textContent = '00:00';
        tvProgressFill.style.width = '0%';
      } else {
        // Idle
        tvPhaseBadge.textContent = 'EN ESPERA';
        tvRoundTag.textContent = 'LISTOS PARA EL ROUND 1';
        tvClock.textContent = '01:30';
        tvProgressFill.style.width = '100%';
      }

      // Event Display Below Clock (Always visible during active event)
      if (state.currentRule && state.ruleTimeLeft > 0 && (state.phase === 'fighting' || state.phase === 'paused')) {
        tvEventCard.style.display = 'flex';
        tvNextSpinPill.style.display = 'none';

        tvEventCard.className = 'tv-event-card';
        if (state.currentRule.targetTeam === 'red') {
          tvEventCard.classList.add('team-red');
          tvEventBadge.innerHTML = '⚡ RETO EXCLUSIVO: ESQUINA ROJA';
        } else if (state.currentRule.targetTeam === 'blue') {
          tvEventCard.classList.add('team-blue');
          tvEventBadge.innerHTML = '⚡ RETO EXCLUSIVO: ESQUINA AZUL';
        } else {
          tvEventBadge.innerHTML = '⚡ EVENTO ACTIVO DE RULETA';
        }

        tvEventIcon.textContent = state.currentRule.icon ? state.currentRule.icon.split(' ')[0] : '🥊';
        tvEventTitle.textContent = state.currentRule.fullName || state.currentRule.name;
        tvEventDesc.textContent = state.currentRule.description || '';
        tvEventPts.textContent = state.currentRule.pts > 0 ? `+${state.currentRule.pts} PTS` : 'RELEVO';

        tvEventCountdown.textContent = `⏱️ QUEDAN ${state.ruleTimeLeft}s`;
        if (state.ruleTimeLeft <= 5) {
          tvEventCountdown.classList.add('urgent');
        } else {
          tvEventCountdown.classList.remove('urgent');
        }

        const ruleDuration = state.ruleDuration || 30;
        const rulePct = (state.ruleTimeLeft / ruleDuration) * 100;
        tvEventProgressFill.style.width = `${rulePct}%`;
      } else {
        tvEventCard.style.display = 'none';
        if (state.phase === 'fighting' && state.rouletteTimeLeft > 0) {
          tvNextSpinPill.style.display = 'flex';
          tvNextSpinSec.textContent = `${state.rouletteTimeLeft}s`;
        } else {
          tvNextSpinPill.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
